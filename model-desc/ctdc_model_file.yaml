# Cancer Moonshot Biobank data model nodes, properties and relationships file
# Title case names are "reserved" (meaningful to the parser)
# Lower case names are labels for the entities
Handle: CTDC

Version: v3.4.1

Nodes:
  # node:
  #   Desc: text
  #   Tags:
  #     Category: value
  #     Assignment: value
  #     Class: value
  #     Template: 'Yes'
  #   Props:
  #     - property_1
  #     - property_2
  #     - property_3
  #     - property_4
  #     - property_5
  #     - property_6
  program:  
    Desc: Within the Clinical Trial Data Commons, projects and studies/trials are grouped into discrete programs, based upon the origins and/or scientific nature of each project or study/trial. These programs may or may not directly relate to any formal program, e.g. NCI funding programs. The Program node contains the properties required to appropriately characterize any given CTDC program.
    Tags:
      Category: administrative
      Assignment: core
      Class: primary
      Template: 'Yes'
    Props:
      - program_name
      - program_short_name
      - program_short_description
      - program_full_description
      - program_sort_order
      - program_external_url
      - crdc_id

  principal_investigator:
    Desc: The Principal Investigator node contains properties which identify the principal investigator(s) responsible for any given study/trial. A study/trial may have one or more principal investigators, and any given individual may be listed as a principal investigator on more than one study/trial.
    Tags:
      Category: study
      Assignment: core
      Class: primary
      Template: 'Yes'
    Props:
      - person_record_id
      - person_first_name
      - person_last_name
      - person_middle_name
      - person_orcid
      - crdc_id
  study:
    Desc: The Study node contains properties required to characterize each study/trial in terms of a title, describe when, how and why the study/trial was conducted, and provide links to additional information about the study/trial.
    Tags:
      Category: study
      Assignment: core
      Class: primary
      Template: 'Yes'
    Props:
      - study_accession
      - study_name
      - study_short_name
      - study_id
      - nci_id
      - nct_id
      - study_description
      - study_version
      - study_type
      - dates_of_conduct
      - study_age_group
      - study_outcome
      - study_population
      - study_biobank
      - study_justification
      - study_data_sharing_plan
      - other_study_outcome
      - recist_objective_response_rate
      #- study_status   #this is flagged as canceled
      - grant_or_affiliated_network
      - study_organization
      - crdc_id
  study_arm:
    Desc: The Study Arm node contains properties required to describe the arms into which any given study/trial was divided. Division of a study/trial into multiple arms is optional and is at the discretion of the data owners, based upon the way in which the study/trial in question was structured, and how best that structure can be represented within the ICDC. Where applicable, the appropriate study arms are defined during the study on-boarding process and then created via a specific data loading file.
    Tags:
      Category: study
      Assignment: core
      Class: secondary
      Template: 'Yes'
    Props:
      - study_arm_record_id # needed to differentiate between arms having the same name, but which actually belong to different studies.
      - study_arm_name # arm name
      - study_arm_description
      # - ctep_treatment_assignment_code # time to get rid of this!!!
      - crdc_id
  cohort:
    Desc: The Cohort node contains properties required to describe the cohorts into which any given study/trial was divided. Division of a study/trial into multiple cohorts is optional and is at the discretion of the data owners, based upon the way in which the study/trial in question was structured, and how best that structure can be represented within the ICDC. Where applicable, the appropriate cohorts are defined during the study on-boarding process and then created via a specific data loading file.
    Tags:
      Category: study
      Assignment: core
      Class: secondary
      Template: 'Yes'
    Props:
      - cohort_record_id # needed to differentiate between cohorts that share values for cohort description, but which actually belong to different studies
      - cohort_name # cohort name generally inclusive of some detail as to agent and dose
      - cohort_dose # the intended or protocol dose
      - cohort_dose_uom # the unit of measurement associated with the intended or protocol dose
      - cohort_description # description of the cohort generally inclusive of some detail as to agent and dose
      - crdc_id
  associated_link:
    Desc: The Associated Link node contains the properties required to associate multiple links to additional information about any given study/trial to the appropriate study/trial, and define an inuitive label via which each link will be diplayed within the UI. 
    Tags:
      Category: study
      Assignment: core
      Class: secondary
      Template: 'Yes'
    Props:
      - associated_link_record_id
      - associated_link_name
      - associated_link_url
      - crdc_id
  image_collection:
    Desc: The Image Collection node is comprised of properties which describe collections of images that are associated with any given study/trial. These properties characterize such image collections in terms of the types of images they contain, where the collections are hosted, and how they can be accessed.
    Tags:
      Category: study
      Assignment: core
      Class: secondary
      Template: 'Yes'
    Props:
      - image_collection_record_id
      - image_collection_name
      - image_type_included
      - image_collection_url
      - repository_name
      - collection_access
      - crdc_id
  consent_group:
    Desc: "A set of study participants who have signed the same consent agreement and that will be included in the dbGaP repository."
    Tags:
      nodeReq: true
      Category: case # in lieu of "participant" being a category recognized by the DMN
      Assignment: extended
      Class: secondary
      Template: 'Yes'
    Props:
      - consent_group_id
      - consent_group_name
      - consent_group_number
      - crdc_id
  publication:
    Desc: The Publication node is comprised of properties which describe publications that are directly associated with any given study/trial of interest, inclusive of the location(s) at which publications can be viewed in electronic form.
    Tags: 
      Category: study
      Assignment: core
      Class: primary
      Template: 'Yes'
    Props:
      - digital_object_id
      - pubmed_id
      - publication_title
      - authorship
      - year_of_publication
      - journal_citation

  participant:
    Desc: Individual who takes part in the study
    Tags:
      Category: case # in lieu of "participant" being a category recognized by the DMN
      Assignment: core
      Class: primary
      Template: 'Yes'
    Props:
      - participant_id
      - biomarker_results_available
      - radiology_report_available
      - radiology_images_available
      - histology_images_available
      - crdc_id
  demographic:
    Desc: The Demographic node is comprised of properties which describe the key characteristics of each study/trial participant, such as sex, race and etnnicity, etc.
    Tags:
      Category: case # in lieu of "participant" being a category recognized by the DMN
      Assignment: core
      Class: primary
      Template: 'Yes'
    Props:
      - demographic_record_id
      - participant_age_at_diagnosis
      - age_at_enrollment
      - race
      - ethnicity
      - sex
      # - reported_gender
      - height
      - weight
      - body_surface_area
      - occupation
      - income
      - highest_level_of_education
      - ncbi_taxonomy_id
      - ncbi_taxonomy_name
      - ecog_ps
      - karnofsky
      - body_mass_index
      - crdc_id
  exposure:
    Desc: Properties within the Exposure node capture information concerning a participant's environmental, workplace and lifestyle exposure(s) which have the potential to have increased the risk of developing cancer, and/or caused cancer, and/or exacerbated an underlying maliignancy.
    Tags:
      Category: case # in lieu of "participant" being a category recognized by the DMN
      Assignment: core
      Class: secondary
      Template: 'Yes'
    Props:
      - exposure_record_id
      - environmental_exposure_type
      - carcinogen_exposure
      - crdc_id
  diagnosis:
    Desc: The Diagnosis node contains numerous properties which fully characterize the type of cancer with which any given study/trial participant was diagnosed, inclusive of disease stage, histology/pathology, and age at diagnosis.
    Tags:
      Category: clinical
      Assignment: core
      Class: primary
      Template: 'Yes'
    Props:
      - diagnosis_record_id
      - primary_diagnosis
      - primary_diagnosis_disease_group
      #- icd_10_disease_code
      - ctep_disease_term
      - meddra_disease_code
      - snomed_disease_term
      - snomed_disease_code # this is disease plus stage as presented within the CMB Catalog
      #- icd_o_primary_site
      - primary_disease_site
      - histology
      #- date_of_confirmation_of_histology
      - histological_subtype
      - stage_of_disease
      - tumor_grade
      - date_of_diagnosis # quantified in days indexed to date of trial enrollment
      #- subject_age_at_diagnosis
      - icd_03_disease_term
      - icd_03_disease_code
      - icd_o_primary_site
      - icd_10_disease_code
      - disease_staging_system
      - disease_staging_system_version
      - diagnosis_classification_system
      - date_of_confirmation_of_histology
      - t_category
      - n_category
      - m_category
      - crdc_id
  therapy:
    Desc: The Therapy node contains properties which detail therapeutic interventions administered to a participant as standard and/or targeted therapies, i.e. therapies considered to be appropriate for and effective against the specific type of cancer with which the participant has been diagnosed.
    Tags:
      Category: clinical_trial # in lieu of "treatment" being a category recognized by the DMN
      Assignment: core
      Class: secondary
      Template: 'Yes'
    Props:
      - therapy_record_id
      - therapy_name
      - therapy_description
      - therapy_category
      - therapy_type
      - therapy_start_date
      - therapy_end_date
      - off_treatment
      - off_treatment_reason
      - course_number
      - number_of_doses
      - planned_dose
      - planned_dose_units
      - therapy_dose
      - therapy_dose_units
      - therapy_frequency
      - current_response_to_therapy
      - best_response_to_therapy
      - date_of_current_response_to_therapy
      - date_of_best_response_to_therapy
      - dose_changes_delays
      - dose_changes_delays_description
      - crdc_id
  surgery:
    Desc: The Surgery node contains properties which detail surgical procedures performed upon the participant in question, including the type of procedure performed, the anatomical locations impacted, notable findings, and whether or not the procedure was conducted as part of the overall treatment of the cancer in question.
    Tags:
      Category: clinical_trial # in lieu of "treatment" being a category recognized by the DMN
      Assignment: core
      Class: secondary
      Template: 'Yes'
    Props:
      - surgical_procedure_record_id
      - surgical_procedure
      - surgical_procedure_date
      - surgical_procedure_anatomical_location
      - surgical_procedure_therapeutic
      - surgical_procedure_findings
      - extent_of_residual_disease
      - crdc_id
  radiotherapy:
    Desc: The Radiotherapy node contains properties which detail radiological procedures performed on the participant in question as part of their overall treatent, including the type of each radiological procedure performed, the anatomical location(s) impacted, and the response to such radiotherapy.
    Tags:
      Category: clinical_trial # in lieu of "treatment" being a category recognized by the DMN
      Assignment: core
      Class: secondary
      Template: 'Yes'
    Props:
      - radiological_procedure_record_id
      - radiological_procedure
      - radiological_procedure_anatomical_location
      - radiation_dose
      - radiation_frequency
      - radiation_extent
      - radiotherapy_start_date
      - radiotherapy_end_date
      - best_response_to_radiotherapy
      - response_system_property
      - response_system_version
      - total_radiation_dose
      - total_radiation_dose_units
      - total_radiation_administered_units
      - radiation_administered_units
      - crdc_id
  participant_status:
    Desc: Properties within the Participant Status node capture key information as to the participant's survival status and where applicable, a participant's withdrawal from the study. 
    Tags:
      Category: clinical
      Assignment: core
      Class: secondary
      Template: 'Yes'
    Props:
      - participant_status_record_id
      - survival_status
      - primary_cause_of_death
      - off_study
      - off_study_reason
      - off_study_reason_other
      - crdc_id
  specimen:
    Desc: The Specimen node contains numerous properties which provide an in-depth characterization of the types of biospecimens which were collected from any given study/trial participant and subsequently analyzed.
    Tags:
      Category: biospecimen # in lieu of "specimen" being a category recognized by the DMN
      Assignment: core
      Class: primary
      Template: 'Yes'
    Props:
      # - specimen_id
      - specimen_record_id
      - specimen_type # this refers to the nature of the specimen originally isolated from the participant, and from which various aliquots and/or derivative biospecimens were subseuqently isolated
      # - specimen_type # this refers to the nature of the sub-specimen that was actually subject to downstream analysis
      - specimen_category # confusingly close to the CMB Catalog Site's "Tissue Category" i.e. the indicator as to normal vs primary vs metastatic, but acceptable terms for caDSR 7069877, quoted as a reference for "specimen category" uses terms that do not relate to "tissue category"
      - anatomical_collection_site
      - tissue_category # this would be the Catalog Site's "Tissue Category" i.e. the indicator as to normal vs primary vs metastatic, which appears within at least two of the DDs as Tissue Type
      - icd_o_3_tissue_morphology
      - assessment_timepoint # this appears to be the Catalog Site's "Collection Timepoint" caDSR 7065963
      - collection_date # from the CMB perspective, this is equivalent to the above, with collection date indexed to enrollment date caDSR 6401821
      # - days_from_diagnosis_to_specimen_collection
      # - days_from_first_subject_visit_to_specimen_collection
      - days_from_first_treatment_to_specimen_collection
      - days_from_recurrence_to_specimen_collection
      - days_from_specimen_collection_to_initial_pathologic_diagnosis
      - necrosis_area_percentage
      - quality_of_specimen
      - viable_tumor_area_percentage
      - tumor_tissue_total_area_percentage
      - days_from_first_participant_visit_to_specimen_collection
      - days_from_initial_genomic_sequencing_to_specimen_collection
      - fibrosis_area_percentage
      - dna_integrity_number
      - a260_a230
      - pbmc_viability
      - pbmc_recovery
      - crdc_id
  assay:
    Desc: The Assay node contains numerous properties which provide an in-depth characterization of the types of assays which were conducted from any given biospecimen and subsequently analyzed.
    Tags:
      Category: biospecimen # in lieu of "specimen" being a category recognized by the DMN
      Assignment: core
      Class: primary
      Template: 'Yes'
    Props:
      - assay_record_id 
      - assay_category 
      - assay_type
      - qc_status
      - crdc_id
  next_generation_sequencing_assay:
    Desc: The Next Generation Sequencing Assay node contains numerous properties which provide an in-depth characterization of the types of next generation sequencing assays which were conducted from any given biospecimen and subsequently analyzed.
    Tags:
      Category: biospecimen # in lieu of "specimen" being a category recognized by the DMN
      Assignment: core
      Class: secondary
      Template: 'Yes'
    Props:
      - sequencing_assay_record_id
      - library_preparation_kit
      - sequencing_platform
      - sequencing_read_length  
      - paired_end_sequencing
      - target_capture_kit
      - enrichment_kit
      - azimuth_reference_genome_version
      - tabula_sapiens_reference_genome_version
      - azimuth_reference
      - tabula_sapiens_reference
      - sequencing_depth
      - total_reads
      - crdc_id
  immune_assay:   
    Desc: The Immune Assay node contains numerous properties which provide an in-depth characterization of the types of immune assays which were conducted from any given biospecimen and subsequently analyzed.
    Tags:
      Category: biospecimen # in lieu of "specimen" being a category recognized by the DMN
      Assignment: core
      Class: secondary
      Template: 'Yes'
    Props:
      - immune_assay_record_id
      - antibody_used_for_immune_based_assay
      - clone 
      - antigen
      - antigen_type 
      - crdc_id
  cell_based_assay:
    Desc: The Cell Based Assay node contains numerous properties which provide an in-depth characterization of the types of cell based assays which were conducted from any given biospecimen and subsequently analyzed.
    Tags:
      Category: biospecimen # in lieu of "specimen" being a category recognized by the DMN
      Assignment: core
      Class: secondary
      Template: 'Yes'   
    Props:
      - cell_based_assay_record_id
      - fluor_wavelength
      - antibody_used_for_cell_based_assay
      - roi_id
      - positive_cell_detection
      - crdc_id
  file:
    Desc: Data files can be associated with CTDC project, study, participant, diagnosis and specimen records, but are not themselves stored within the application. Instead, the application stores records as to the existence and nature of such data files. The Data File node is comprised of properties which characterize these files in terms of their size, format and content, such that they can be appropriately represented within the application's UI, and in terms of their storage location, such that they can be retrieved for analysis.
    Tags:
      Category: file
      Assignment: core
      Class: primary
      Template: 'Yes'
    Props:
      - data_file_name
      - data_file_type
      - data_file_description
      - data_file_format
      - data_file_size
      - data_file_checksum_value
      - data_file_checksum_type
      - data_file_compression_status
      - data_file_uuid
      - data_file_location
      - crdc_id
Relationships:
  belongs_to:
    Mul: many_to_one
    Ends:
      - Src: participant
        Dst: study
      - Src: study # so can a lowest-level study belong directly to a highest-level program?
        Dst: program
      - Src: participant
        Dst: study_arm
      - Src: participant
        Dst: cohort
      - Src: cohort
        Dst: study_arm
      - Src: study_arm
        Dst: study
      - Src: cohort
        Dst: study # to accommodate a Study having Cases that should be grouped into Cohorts, but where Study Arms do not apply
    Props: null
  associated_with: # group all file relationships in here?
    Mul: many_to_one
    Ends:
      - Src: file
        Dst: specimen
      - Src: file
        Dst: diagnosis
      - Src: file
        Dst: participant
      - Src: file
        Dst: study
      - Src: associated_link
        Dst: study
      - Src: image_collection
        Dst: study
      - Src: file
        Dst: assay
      - Src: assay
        Dst: specimen
    Props: null      
  of_study:
    Mul: many_to_many
    Ends:
      - Src: publication
        Dst: study
        Mul: many_to_one
    Props: null
      #- Src: principal_ivestigator # alternatively, express principal investigator relationships to both study and project elsewhere as "directs" relationships
        #Dst: study
      #- Src: file # alternatively, group all file relationships elsewhere as "associated_with" relationships?
        #Dst: study
        #Mul: many_to_one
    #Props: null    
  of_consent_group:
    Props: null
    Mul: many_to_one
    Ends:
      - Src: consent_group
        Dst: study
  of_assay:
    Mul: many_to_one
    Ends:
      - Src: assay
        Dst: next_generation_sequencing_assay
      - Src: assay
        Dst: immune_assay
      - Src: assay
        Dst: cell_based_assay
    Props: null
  of_participant:
    Mul: many_to_one
    Ends:
      - Src: demographic
        Dst: participant
        Mul: one_to_one
      - Src: exposure
        Dst: participant
      - Src: diagnosis
        Dst: participant
      #- Src: treatment
      #  Dst: participant
      - Src: therapy
        Dst: participant
        #Mul: one_to_many
      - Src: surgery
        Dst: participant
        #Mul: many_to_many
      - Src: radiotherapy
        Dst: participant
        #Mul: many_to_many
      - Src: participant_status
        Dst: participant
        Mul: one_to_one  
        # to accommodate a Specimen being directly associated with a Subject, rather than being only indirectly associated with a Subject through a Visit, etc.
      - Src: specimen
        Dst: participant
        # to accommodate a Data File being directly associated with a Subject, rather than being only indirectly associated with a Subject through a Specimen or Diagnosis
      # - Src: file # alternatively, group all file relationships elsewhere as "associated_with" relationships?
      #   Dst: participant
      - Src: participant
        Dst: consent_group
    Props: null
  #of_specimen:
    #Mul: many_to_one
    #Ends:
      #- Src: file # alternatively, group all file relationships elsewhere as "associated_with" relationships?
        #Dst: specimen
    #Props: null       
  directs: 
    Mul: many_to_many
    Ends:
      - Src: principal_investigator
        Dst: study
    Props: null